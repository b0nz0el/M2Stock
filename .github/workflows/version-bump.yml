name: Bump app version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version
        run: npm run bump -- patch

      - name: Commit and push version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/sw.js public/assets/js/components/app-sidebar.js public/dashboard/index.html public/assets/js/app.js
          if git diff --cached --quiet; then
            echo "Version files did not change; nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): bump app version" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
