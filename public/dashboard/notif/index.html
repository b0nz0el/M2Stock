<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>aQuaStock Pro — Notifikasi</title>
<link rel="icon" type="image/svg+xml" href="../../assets/images/logo.svg">

<!-- Auth guard (redirect jika belum login) -->
<script>
(function(){try{if(!Object.keys(localStorage).some(function(k){return k.startsWith('sb-')&&k.endsWith('-auth-token');})){window.location.replace('/login/');}}catch(e){}})();
</script>

<!-- RBAC Route Guard (Layer 2) & Read-Only UI (Layer 1) -->
<script type="module">
  import { guardRoute } from '../../assets/js/utils/rbac.js';
  import { applyReadOnlyUI } from '../../assets/js/utils/rbac-ui.js';
  await guardRoute('notif');
  applyReadOnlyUI();
</script>

<!-- Inter font (self-host) -->
<link rel="preconnect" href="/" crossorigin>
<link rel="preload" href="../../assets/fonts/InterVariable.woff2"
      as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/fonts/inter.css">

<!-- Styles -->
<link rel="stylesheet" href="../../assets/css/tailwind.static.css">
<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/pages.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body class="bg-black text-white antialiased">

<a href="#main-content" class="skip-link">Lewati ke konten utama</a>

<div class="flex min-h-screen">

  <!-- ═══════════ SIDEBAR (Web Component) ═══════════ -->
  <app-sidebar>
    <noscript>
      <aside class="w-64 bg-[#1C1C1E] p-4 border-r border-white/5">
        <p class="text-sm font-bold text-[#32ADE6]">aQuaStock Pro</p>
        <p class="text-xs text-[#A0A0A5] mt-1">Aktifkan JavaScript untuk navigasi lengkap</p>
      </aside>
    </noscript>
  </app-sidebar>

  <!-- ═══════════ MAIN ═══════════ -->
  <main id="main-content" class="flex-1 overflow-y-auto pb-24 md:pb-8">

    <header class="sticky top-0 bg-black/70 backdrop-blur-xl border-b border-white/5 px-6 py-3.5 flex items-center gap-4 z-10">

      <button onclick="toggleSidebar()" data-action="toggle-sidebar" aria-expanded="false" aria-label="Buka menu" class="md:hidden text-white p-1">
        <i data-lucide="menu" class="w-5 h-5" aria-hidden="true"></i>
      </button>

      <div class="hidden md:flex items-center gap-2 text-sm">
        <span class="text-[#A0A0A5]">aQuaStock</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-[#A0A0A5]" aria-hidden="true"></i>
        <span id="breadcrumb" class="font-medium text-white">Notifikasi</span>
      </div>

      <div class="flex-1 md:max-w-md md:ml-6 relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#A0A0A5]" aria-hidden="true"></i>
        <input type="text" id="global-search" placeholder="Cari apa saja..." aria-label="Pencarian global"
               class="w-full bg-[#1C1C1E] border border-white/5 rounded-xl pl-10 pr-16 py-2.5 text-sm focus:outline-none focus:border-[#0088CC] text-white">
        <kbd class="hidden md:block absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-[#A0A0A5] bg-white/5 px-1.5 py-0.5 rounded border border-white/10">⌘K</kbd>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <button data-action="notif" aria-label="Notifikasi" class="bg-[#1C1C1E] hover:bg-white/5 p-2.5 rounded-xl relative border border-white/5 transition">
          <i data-lucide="bell" class="w-4 h-4" aria-hidden="true"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#FF3B30] rounded-full hidden"></span>
        </button>
      </div>
    </header>

    <!-- ═══════════ NOTIFIKASI CONTENT ═══════════ -->
    <div id="page-notif" class="page active p-6 space-y-6 max-w-4xl mx-auto">
      
      <!-- Header & Actions -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
            <span class="w-9 h-9 rounded-xl bg-[#0088CC]/10 text-[#32ADE6] grid place-items-center">
              <i data-lucide="bell" class="w-5 h-5"></i>
            </span>
            Pusat Notifikasi
          </h2>
          <p class="text-sm text-[#A0A0A5] mt-1">Peringatan stok, perubahan harga, dan aktivitas sistem penting</p>
        </div>

        <button type="button" id="btn-mark-all-read" data-action="edit" class="text-xs sm:text-sm text-[#32ADE6] hover:text-[#0088CC] hover:underline flex items-center gap-1.5 font-semibold transition self-start sm:self-auto px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10">
          <i data-lucide="check-check" class="w-4 h-4" aria-hidden="true"></i>
          <span>Tandai semua dibaca</span>
        </button>
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-2 border-b border-white/5 pb-4">
        <button type="button" data-notif-filter="all" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-[#0088CC] text-white flex items-center gap-1.5 transition">
          <span>Semua</span>
          <span id="count-notif-all" class="px-1.5 py-0.2 rounded-full text-[10px] bg-white/20">0</span>
        </button>
        <button type="button" data-notif-filter="unread" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-[#1C1C1E] text-[#A0A0A5] border border-white/10 hover:text-white flex items-center gap-1.5 transition">
          <span>Belum Dibaca</span>
          <span id="count-notif-unread" class="px-1.5 py-0.2 rounded-full text-[10px] bg-[#FF3B30]/20 text-[#FF3B30] font-bold">0</span>
        </button>
        <button type="button" data-notif-filter="read" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-[#1C1C1E] text-[#A0A0A5] border border-white/10 hover:text-white transition">
          <span>Sudah Dibaca</span>
        </button>
        <button type="button" id="btn-refresh-notif" title="Muat ulang notifikasi" class="ml-auto p-2 rounded-xl bg-[#1C1C1E] text-[#A0A0A5] border border-white/10 hover:text-white transition">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Notifications List Container -->
      <div id="notif-list-container" class="space-y-3">
        <!-- Dynamic content via notif.js -->
      </div>

      <!-- Empty State -->
      <div id="notif-empty-state" class="hidden py-20 text-center text-[#A0A0A5] border border-dashed border-white/10 rounded-2xl p-8">
        <div class="w-14 h-14 rounded-2xl bg-white/5 text-[#A0A0A5] grid place-items-center mx-auto mb-3">
          <i data-lucide="bell-off" class="w-7 h-7"></i>
        </div>
        <p class="font-semibold text-white text-base">Tidak ada notifikasi</p>
        <p class="text-xs text-[#A0A0A5] mt-1">Kotak masuk notifikasi Anda saat ini kosong dan up-to-date.</p>
      </div>

    </div>

  </main>

  <!-- ═══════════ BOTTOM TAB BAR (MOBILE) ═══════════ -->
  <nav class="bottom-nav md:hidden" aria-label="Navigasi utama">
    <div class="bottom-nav-items">
      <button type="button" class="bottom-nav-item" data-tab="dashboard" onclick="window.location.href='/dashboard/'">
        <i data-lucide="layout-dashboard" aria-hidden="true"></i>
        <span>Dashboard</span>
      </button>
      <button type="button" class="bottom-nav-item" data-tab="items" onclick="window.location.href='/dashboard/items/'">
        <i data-lucide="package" aria-hidden="true"></i>
        <span>Barang</span>
      </button>
      <button type="button" class="bottom-nav-item active" data-tab="notif" onclick="window.location.href='/dashboard/notif/'">
        <i data-lucide="bell" aria-hidden="true"></i>
        <span>Notif</span>
      </button>
      <button type="button" class="bottom-nav-item" data-tab="menu" onclick="window.location.href='/dashboard/settings/'">
        <i data-lucide="menu" aria-hidden="true"></i>
        <span>Menu</span>
      </button>
    </div>
  </nav>
</div>

<!-- ═══════════ TOAST CONTAINER ═══════════ -->
<div id="toast-container" 
     class="fixed top-5 right-5 left-5 sm:left-auto sm:w-auto z-[100] flex flex-col gap-2 pointer-events-none"
     role="status" aria-live="polite"></div>

<!-- Scripts -->
<script type="module" src="../../assets/js/supabase-client.js"></script>
<script src="../../assets/js/auth.js" defer></script>
<script src="../../assets/js/utils.js" defer></script>
<script src="../../assets/js/navigation.js" defer></script>
<script src="../../assets/js/animations.js" defer></script>
<script src="../../assets/js/components/app-sidebar.js" defer></script>
<script src="../../assets/js/icons.js" defer></script>
<script type="module" src="./notif.js"></script>
</body>
</html>
