    <div id="page-users" class="page active p-6 space-y-5">

        <div>
          <h2 class="text-3xl font-bold tracking-tight">Kelola User</h2>
          <p class="text-sm text-[#A0A0A5] mt-1">Daftar pengguna terdaftar & pengaturan hak akses (Role)</p>
        </div>
      </div>

      <!-- METRICS HEADER -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Total User</p>
          <p class="text-2xl font-bold mt-1 text-white" id="metric-total-users">0</p>
        </div>
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Owner</p>
          <p class="text-2xl font-bold mt-1 text-[#32ADE6]" id="metric-owner-count">0</p>
        </div>
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Staff</p>
          <p class="text-2xl font-bold mt-1 text-[#34C759]" id="metric-staff-count">0</p>
        </div>
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Viewer</p>
          <p class="text-2xl font-bold mt-1 text-[#AF52DE]" id="metric-viewer-count">0</p>
        </div>

      <!-- SEARCH BAR -->
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-[#A0A0A5]" aria-hidden="true"></i>
          <input type="text" id="search-users" placeholder="Cari nama atau email pengguna..."

        </div>
        <span class="text-xs text-[#A0A0A5]" id="users-count-info">Memuat user...</span>
      </div>

      <!-- TABEL PENGGUNA -->

            <thead class="bg-white/[0.02] border-b border-white/5">
              <tr class="text-left text-[#A0A0A5]">
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">User</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Email</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Role</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Status</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Terakhir Login</th>

<!-- ═══════════ MODAL UBAH ROLE USER ═══════════ -->
<div id="modal-user-role" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="modal-role-title">
  <div class="bg-[#1C1C1E] border border-white/10 rounded-2xl w-full max-w-md shadow-2xl p-6 space-y-4 my-auto">
    <div class="flex items-center justify-between pb-3 border-b border-white/5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#0088CC]/15 grid place-items-center text-[#32ADE6]">
          <i data-lucide="shield-check" class="w-5 h-5" aria-hidden="true"></i>
        </div>
        <div>
          <h3 id="modal-role-title" class="text-lg font-bold text-white">Ubah Role Pengguna</h3>
          <p class="text-xs text-[#A0A0A5] mt-0.5">Atur tingkat hak akses pengguna</p>
        </div>
      </div>
      <button type="button" onclick="closeRoleModal()" aria-label="Tutup modal" class="p-1.5 hover:bg-white/5 rounded-lg text-[#A0A0A5] hover:text-white transition">

      </button>
    </div>

    <form id="form-user-role" class="space-y-4" onsubmit="handleSaveRole(event)">
      <input type="hidden" id="role-target-user-id">

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-[#A0A0A5] mb-1">Nama Pengguna</label>
          <input type="text" id="role-target-user-name" readonly class="w-full bg-black/40 border border-white/5 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none cursor-not-allowed">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#A0A0A5] mb-1">Email Pengguna</label>
          <input type="email" id="role-target-user-email" readonly class="w-full bg-black/40 border border-white/5 rounded-xl px-3.5 py-2.5 text-sm text-[#A0A0A5] focus:outline-none cursor-not-allowed font-mono">
        </div>
      </div>

      <div>
        <label for="select-user-role" class="block text-xs font-medium text-[#A0A0A5] mb-1.5">Role Pengguna <span class="text-[#FF3B30]">*</span></label>
        <select id="select-user-role" required
                class="w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm focus:border-[#0088CC] focus:outline-none">
          <option value="owner">OWNER (Akses Penuh & Kelola User)</option>
          <option value="staff">STAFF (Operasional & Transaksi)</option>

        </select>
      </div>

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-white/5">
        <button type="button" onclick="closeRoleModal()" class="px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/5 text-[#A0A0A5] hover:text-white transition">
          Batal
        </button>
        <button type="submit" id="btn-save-user-role" class="bg-[#0088CC] hover:bg-[#0077BB] px-5 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-lg shadow-[#0088CC]/20 transition">
          <i data-lucide="check" class="w-4 h-4" aria-hidden="true"></i> Simpan Role

<!-- Logika Users Management Live -->
<script>
let usersData = [];
let searchQuery = '';

const AVATAR_GRADIENTS = [
  'from-[#0088CC] to-[#32ADE6]',
  'from-[#34C759] to-[#28A745]',
  'from-[#AF52DE] to-[#9B3DC8]',
  'from-[#FF9500] to-[#FF5E3A]'
];

function formatTimeAgoWIB(dateStr) {
  if (!dateStr) return 'Belum pernah login';
  const d = new Date(dateStr);
  const now = new Date();
  const diffSec = Math.floor((now - d) / 1000);

  if (diffSec < 60) return 'Baru saja';
  if (diffSec < 3600) return `${Math.floor(diffSec / 60)} menit lalu`;
  if (diffSec < 86400) return `${Math.floor(diffSec / 3600)} jam lalu`;

  return d.toLocaleDateString('id-ID', {
    timeZone: 'Asia/Jakarta',
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
}

function getRoleBadge(role) {
  const r = (role || 'staff').toLowerCase();
  if (r === 'owner') {
    return `<span class="badge bg-[#0088CC]/15 text-[#32ADE6] font-bold">OWNER</span>`;
  }
  if (r === 'viewer') {
    return `<span class="badge bg-[#AF52DE]/15 text-[#AF52DE] font-semibold">VIEWER</span>`;
  }
  return `<span class="badge bg-[#34C759]/15 text-[#34C759] font-semibold">STAFF</span>`;
}

async function loadUsers() {
  const tbody = document.getElementById('users-table-body');
  try {
    const res = await Api.users.getAll();
    if (!res.ok) {
      tbody.innerHTML = `<tr><td colspan="6" class="px-5 py-8 text-center text-[#FF3B30]">${res.error?.message || 'Gagal memuat daftar pengguna'}</td></tr>`;
      return;
    }
    usersData = res.data || [];
    updateUserMetrics();
    renderUsers();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6" class="px-5 py-8 text-center text-[#FF3B30]">Terjadi kesalahan: ${err.message}</td></tr>`;
  }
}

function updateUserMetrics() {
  const total = usersData.length;
  const ownerCount = usersData.filter(u => (u.role || '').toLowerCase() === 'owner').length;
  const staffCount = usersData.filter(u => (u.role || '').toLowerCase() === 'staff').length;
  const viewerCount = usersData.filter(u => (u.role || '').toLowerCase() === 'viewer').length;

  document.getElementById('metric-total-users').textContent = total;
  document.getElementById('metric-owner-count').textContent = ownerCount;
  document.getElementById('metric-staff-count').textContent = staffCount;
  document.getElementById('metric-viewer-count').textContent = viewerCount;
  document.getElementById('users-count-info').textContent = `Total: ${total} user`;
}

function renderUsers() {
  const tbody = document.getElementById('users-table-body');
  let filtered = usersData;

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(u =>
      (u.email && u.email.toLowerCase().includes(q)) ||
      (u.full_name && u.full_name.toLowerCase().includes(q)) ||
      (u.role && u.role.toLowerCase().includes(q))
    );
  }

  if (filtered.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="px-5 py-12 text-center text-[#A0A0A5]">
          <div class="flex flex-col items-center justify-center gap-2">
            <i data-lucide="user-x" class="w-8 h-8 text-[#A0A0A5]/40" aria-hidden="true"></i>
            <p class="font-medium text-white">Tidak ada data pengguna</p>
          </div>
        </td>
      </tr>
    `;
    if (window.lucide) lucide.createIcons();
    return;
  }

  tbody.innerHTML = filtered.map((u, idx) => {
    const initial = (u.full_name || u.email || 'U').charAt(0).toUpperCase();
    const grad = AVATAR_GRADIENTS[idx % AVATAR_GRADIENTS.length];
    const roleBadge = getRoleBadge(u.role);
    const lastLoginText = formatTimeAgoWIB(u.last_sign_in_at);

    return `
      <tr class="table-row border-b border-white/5 hover:bg-white/[0.02] transition">
        <td class="px-5 py-3.5">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br ${grad} grid place-items-center font-bold text-sm text-white shadow-sm">
              ${initial}
            </div>
            <div>
              <span class="font-medium text-white">${escapeHtml(u.full_name || u.email.split('@')[0])}</span>
            </div>
          </div>
        </td>
        <td class="px-5 py-3.5 text-[#A0A0A5]">${escapeHtml(u.email || '-')}</td>
        <td class="px-5 py-3.5">${roleBadge}</td>
        <td class="px-5 py-3.5">
          <span class="flex items-center gap-1.5 text-[#34C759] text-xs">
            <span class="w-2 h-2 bg-[#34C759] rounded-full"></span>
            Aktif
          </span>
        </td>
        <td class="px-5 py-3.5 text-[#A0A0A5] text-xs">${lastLoginText}</td>
        <td class="px-5 py-3.5 text-right">
          <button onclick="openRoleModal('${u.id}')" title="Edit Role" aria-label="Edit Role ${escapeHtml(u.email)}" class="btn-edit-role p-1.5 hover:bg-white/10 rounded-lg text-[#32ADE6] transition">
            <i data-lucide="pencil" class="w-4 h-4" aria-hidden="true"></i>
          </button>
        </td>
      </tr>
    `;
  }).join('');

  if (window.syncTableLabels) window.syncTableLabels();
  if (window.lucide) lucide.createIcons();
}

function handleSearch(val) {
  searchQuery = val || '';
  renderUsers();
}

function openRoleModal(userId) {
  const user = usersData.find(u => u.id === userId);
  if (!user) return;

  document.getElementById('role-target-user-id').value = user.id;
  document.getElementById('role-target-user-name').value = user.full_name || user.email.split('@')[0];
  document.getElementById('role-target-user-email').value = user.email;
  document.getElementById('select-user-role').value = (user.role || 'staff').toLowerCase();

  const modal = document.getElementById('modal-user-role');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeRoleModal() {
  const modal = document.getElementById('modal-user-role');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

async function handleSaveRole(e) {
  e.preventDefault();
  const userId = document.getElementById('role-target-user-id').value;
  const newRole = document.getElementById('select-user-role').value;
  const user = usersData.find(u => u.id === userId);
  const email = user ? user.email : 'user';

  if (!userId || !newRole) return;

  const btn = document.getElementById('btn-save-user-role');
  btn.disabled = true;
  btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...`;

  try {
    const res = await Api.users.updateRole(userId, newRole);
    if (!res.ok) {
      let rawMsg = res.error?.message || '';
      let errMsg = 'Gagal mengubah role';
      if (/only owner/i.test(rawMsg) || /hanya owner/i.test(rawMsg)) {
        errMsg = 'Hanya owner yang bisa ubah role';
      } else if (/demote the last owner/i.test(rawMsg) || /owner terakhir/i.test(rawMsg)) {
        errMsg = 'Tidak bisa demote owner terakhir';
      } else if (rawMsg) {
        errMsg = rawMsg;
      }
      showToast(errMsg, 'error');
      return;
    }
    showToast(`Role ${email} berhasil diubah`, 'success');
    closeRoleModal();
    await loadUsers();
  } catch (err) {
    let rawMsg = err.message || '';
    let errMsg = 'Terjadi kesalahan: ' + rawMsg;
    if (/only owner/i.test(rawMsg) || /hanya owner/i.test(rawMsg)) {
      errMsg = 'Hanya owner yang bisa ubah role';
    } else if (/demote the last owner/i.test(rawMsg) || /owner terakhir/i.test(rawMsg)) {
      errMsg = 'Tidak bisa demote owner terakhir';
    }
    showToast(errMsg, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Simpan Role`;
    if (window.lucide) lucide.createIcons();
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

document.addEventListener('DOMContentLoaded', () => {
  loadUsers();
});
</script>
