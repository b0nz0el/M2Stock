<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>aQuaStock Pro — Kelola User</title>
<link rel="icon" type="image/svg+xml" href="../../assets/images/logo.svg">

<!-- Auth guard (redirect jika belum login) -->
<script>
(function(){try{if(!Object.keys(localStorage).some(function(k){return k.startsWith('sb-')&&k.endsWith('-auth-token');})){window.location.replace('/login/');}}catch(e){}})();
</script>

<!-- Inter font (self-host) -->
<link rel="preconnect" href="/" crossorigin>
<link rel="preload" href="../../assets/fonts/InterVariable.woff2"
      as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/fonts/inter.css">

<!-- Styles -->
<link rel="stylesheet" href="../../assets/css/tailwind.static.css">
<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/pages.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body class="bg-black text-white antialiased">

<a href="#main-content" class="skip-link">Lewati ke konten utama</a>

<div class="flex min-h-screen">

  <!-- ═══════════ SIDEBAR (Web Component) ═══════════ -->
  <app-sidebar>
    <noscript>
      <aside class="w-64 bg-[#1C1C1E] p-4 border-r border-white/5">
        <p class="text-sm font-bold text-[#32ADE6]">aQuaStock Pro</p>
        <p class="text-xs text-[#A0A0A5] mt-1">Aktifkan JavaScript untuk navigasi lengkap</p>
      </aside>
    </noscript>
  </app-sidebar>

  <!-- ═══════════ MAIN ═══════════ -->
  <main id="main-content" class="flex-1 overflow-y-auto">

    <header class="sticky top-0 bg-black/70 backdrop-blur-xl border-b border-white/5 px-6 py-3.5 flex items-center gap-4 z-10">

      <button onclick="toggleSidebar()" data-action="toggle-sidebar" aria-expanded="false" aria-label="Buka menu" class="md:hidden text-white p-1">
        <i data-lucide="menu" class="w-5 h-5" aria-hidden="true"></i>
      </button>

      <div class="hidden md:flex items-center gap-2 text-sm">
        <span class="text-[#A0A0A5]">aQuaStock</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-[#A0A0A5]" aria-hidden="true"></i>
        <span id="breadcrumb" class="font-medium text-white">Kelola User</span>
      </div>

      <div class="flex-1 md:max-w-md md:ml-6 relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#A0A0A5]" aria-hidden="true"></i>
        <input type="text" id="global-search" placeholder="Cari apa saja..." aria-label="Pencarian global"
               class="w-full bg-[#1C1C1E] border border-white/5 rounded-xl pl-10 pr-16 py-2.5 text-sm focus:outline-none focus:border-[#0088CC]">
        <kbd class="hidden md:block absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-[#A0A0A5] bg-white/5 px-1.5 py-0.5 rounded border border-white/10">⌘K</kbd>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <button data-action="notif" aria-label="Notifikasi" class="bg-[#1C1C1E] hover:bg-white/5 p-2.5 rounded-xl relative border border-white/5 transition">
          <i data-lucide="bell" class="w-4 h-4" aria-hidden="true"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#FF3B30] rounded-full"></span>
        </button>
      </div>
    </header>

    <!-- ═══════════ KELOLA USER CONTENT ═══════════ -->
    <div id="page-users" class="page active p-6 space-y-5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-3xl font-bold tracking-tight">Kelola User</h2>
          <p class="text-sm text-[#A0A0A5] mt-1">Daftar pengguna terdaftar & pengaturan hak akses (Role)</p>
        </div>
      </div>

      <!-- METRICS HEADER -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Total User</p>
          <p class="text-2xl font-bold mt-1 text-white" id="metric-total-users">0</p>
        </div>
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Owner</p>
          <p class="text-2xl font-bold mt-1 text-[#32ADE6]" id="metric-owner-count">0</p>
        </div>
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Staff</p>
          <p class="text-2xl font-bold mt-1 text-[#34C759]" id="metric-staff-count">0</p>
        </div>
        <div class="card p-5">
          <p class="text-xs text-[#A0A0A5] font-medium">Viewer</p>
          <p class="text-2xl font-bold mt-1 text-[#AF52DE]" id="metric-viewer-count">0</p>
        </div>
      </div>

      <!-- SEARCH BAR -->
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-[#A0A0A5]" aria-hidden="true"></i>
          <input type="text" id="search-users" placeholder="Cari nama atau email pengguna..."
                 oninput="handleSearch(this.value)"
                 class="w-full bg-[#1C1C1E] border border-white/5 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-[#0088CC]">
        </div>
        <span class="text-xs text-[#A0A0A5]" id="users-count-info">Memuat user...</span>
      </div>

      <!-- TABEL PENGGUNA -->
      <div class="card overflow-hidden">
        <div class="card-table-wrap">
          <table class="w-full text-sm">
            <thead class="bg-white/[0.02] border-b border-white/5">
              <tr class="text-left text-[#A0A0A5]">
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">User</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Email</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Role</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Status</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider">Terakhir Login</th>
                <th class="px-5 py-3 font-medium text-xs uppercase tracking-wider text-right w-24">Aksi</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr>
                <td colspan="6" class="px-5 py-8 text-center text-[#A0A0A5]">
                  <div class="flex flex-col items-center justify-center gap-2">
                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-[#0088CC]" aria-hidden="true"></i>
                    <span>Memuat daftar user...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- ═══════════ BOTTOM TAB BAR (MOBILE) ═══════════ -->
  <nav class="bottom-nav" aria-label="Navigasi utama">
    <div class="bottom-nav-items">
      <button type="button" class="bottom-nav-item" data-tab="dashboard" onclick="bottomNavTap('dashboard', event)">
        <i data-lucide="layout-dashboard" aria-hidden="true"></i>
        <span>Dashboard</span>
      </button>
      <button type="button" class="bottom-nav-item" data-tab="items" onclick="bottomNavTap('items', event)">
        <i data-lucide="package" aria-hidden="true"></i>
        <span>Barang</span>
      </button>
      <button type="button" class="bottom-nav-item" data-tab="in" onclick="bottomNavTap('in', event)">
        <i data-lucide="arrow-down-circle" aria-hidden="true"></i>
        <span>Masuk</span>
      </button>
      <button type="button" class="bottom-nav-item" data-tab="out" onclick="bottomNavTap('out', event)">
        <i data-lucide="arrow-up-circle" aria-hidden="true"></i>
        <span>Keluar</span>
      </button>
      <button type="button" class="bottom-nav-item" data-tab="menu" data-action="open-menu" aria-expanded="false" onclick="openMenuDrawer(event)">
        <i data-lucide="menu" aria-hidden="true"></i>
        <span>Menu</span>
      </button>
    </div>
  </nav>
</div>

<!-- ═══════════ MODAL UBAH ROLE USER ═══════════ -->
<div id="modal-user-role" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="modal-role-title">
  <div class="bg-[#1C1C1E] border border-white/10 rounded-2xl w-full max-w-md shadow-2xl p-6 space-y-4 my-auto">
    <div class="flex items-center justify-between pb-3 border-b border-white/5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#0088CC]/15 grid place-items-center text-[#32ADE6]">
          <i data-lucide="shield-check" class="w-5 h-5" aria-hidden="true"></i>
        </div>
        <div>
          <h3 id="modal-role-title" class="text-lg font-bold text-white">Ubah Role Pengguna</h3>
          <p class="text-xs text-[#A0A0A5] mt-0.5">Atur tingkat hak akses pengguna</p>
        </div>
      </div>
      <button type="button" onclick="closeRoleModal()" aria-label="Tutup modal" class="p-1.5 hover:bg-white/5 rounded-lg text-[#A0A0A5] hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5" aria-hidden="true"></i>
      </button>
    </div>

    <form id="form-user-role" class="space-y-4" onsubmit="handleSaveRole(event)">
      <input type="hidden" id="role-target-user-id">

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-[#A0A0A5] mb-1">Nama Pengguna</label>
          <input type="text" id="role-target-user-name" readonly class="w-full bg-black/40 border border-white/5 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none cursor-not-allowed">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#A0A0A5] mb-1">Email Pengguna</label>
          <input type="email" id="role-target-user-email" readonly class="w-full bg-black/40 border border-white/5 rounded-xl px-3.5 py-2.5 text-sm text-[#A0A0A5] focus:outline-none cursor-not-allowed font-mono">
        </div>
      </div>

      <div>
        <label for="select-user-role" class="block text-xs font-medium text-[#A0A0A5] mb-1.5">Role Pengguna <span class="text-[#FF3B30]">*</span></label>
        <select id="select-user-role" required
                class="w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm focus:border-[#0088CC] focus:outline-none">
          <option value="owner">OWNER (Akses Penuh & Kelola User)</option>
          <option value="staff">STAFF (Operasional & Transaksi)</option>
          <option value="viewer">VIEWER (Hanya Lihat)</option>
        </select>
      </div>

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-white/5">
        <button type="button" onclick="closeRoleModal()" class="px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/5 text-[#A0A0A5] hover:text-white transition">
          Batal
        </button>
        <button type="submit" id="btn-save-user-role" class="bg-[#0088CC] hover:bg-[#0077BB] px-5 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-lg shadow-[#0088CC]/20 transition">
          <i data-lucide="check" class="w-4 h-4" aria-hidden="true"></i> Simpan Role
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ═══════════ TOAST CONTAINER ═══════════ -->
<div id="toast-container" 
     class="fixed top-5 right-5 left-5 sm:left-auto sm:w-auto z-[100] flex flex-col gap-2 pointer-events-none"
     role="status" aria-live="polite"></div>

<!-- Scripts -->
<script type="module" src="../../assets/js/supabase-client.js"></script>
<script src="../../assets/js/auth.js" defer></script>
<script src="../../assets/js/utils.js" defer></script>
<script type="module" src="../../assets/js/api/index.js"></script>
<script src="../../assets/js/navigation.js" defer></script>
<script src="../../assets/js/charts.js" defer></script>
<script src="../../assets/js/animations.js" defer></script>
<script src="../../assets/js/components/app-sidebar.js" defer></script>
<script src="../../assets/js/icons.js" defer></script>
<script src="../../assets/js/app.js" defer></script>
<script src="../../assets/js/mock-actions.js" defer></script>

<!-- Logika Users Management Live -->
<script src="./users.js"></script>
</body>
</html>
